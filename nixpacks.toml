# Railway. Without this, nixpacks looks for requirements.txt at the repo root, finds none,
# and fails to detect a Python app at all — requirements.txt lives in backend/.
# Render uses render.yaml instead; the Procfile covers everything else.

[phases.setup]
nixPkgs = ["python312"]

[phases.install]
cmds = ["python -m pip install --upgrade pip", "pip install -r backend/requirements.txt"]

[start]
# Must run from backend/ with the repo root intact — see the Procfile comment.
cmd = "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
